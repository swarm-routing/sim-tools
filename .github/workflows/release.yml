name: Release

# The org release pipeline (swarm-routing/.github reusable-release.yml;
# CONTRIBUTING "Cutting a release" there), #26:
#   dispatch `dry-run`  bump, build, attest and verify on the runner only;
#   dispatch `bump`     open the PR `chore(release): bump version A to B`
#                       from bot/release (Commitizen, .cz.toml);
#   merge that PR       the release: `make dist` builds and checks the assets
#                       (routing-bench-<ver>.tar.gz, the swarm-sim-tools wheel and
#                       sdist; tools/release/dist.sh), then SBOM, checksums,
#                       signed provenance, the v<ver> tag and the GitHub release.
# The `image` job then publishes ghcr.io/swarm-routing/ns3-tools:v<ver>-{optimized,debug}
# and moves latest-{optimized,debug} and latest to them (named after the
# repository, swarm-routing/.github#370 and swarm-routing/.github#373;
# v0.1.0 is in the frozen ns3-tools-ns3)
# with the harness built in (CONTRIBUTING "Images"), and the `pypi` job
# publishes the Python distribution swarm-sim-tools (ns3-tools until v1.1.2) to PyPI (a dry run: TestPyPI)
# by trusted publishing (#196).
# A dry run also builds and tests AntHocNet, ns3-tools' main consumer, against
# the commit (routing-bench staged from it, its suites, routing-bench's suite
# through the bare test runner, #211), report-only (.github/downstream.txt,
# `downstream-consumers`, swarm-routing/.github#482).
on:
  workflow_dispatch:
    inputs:
      mode:
        description: "dry-run: bump, build, attest and verify on the runner only; bump: open the bump PR (merging it releases); release-notes: re-render the notes of the release `tag` from CHANGELOG.md; publish: release the merged bump commit `sha` that never released"
        type: choice
        options: [dry-run, bump, release-notes, publish]
        default: dry-run
      increment:
        description: "auto: Commitizen picks the bump from the commits; PATCH, MINOR or MAJOR force it (cz bump --increment; MAJOR for v1.0.0 and v2.0.0)"
        type: choice
        options: [auto, PATCH, MINOR, MAJOR]   # a choice cannot be empty: auto is passed as ''
        default: auto
      tag:
        description: "release-notes only: the existing release whose notes are re-rendered, vX.Y.Z (swarm-routing/.github#524)"
        type: string
        default: ''
      sha:
        description: "publish only: the merged bump commit (40-hex, on main) to release (swarm-routing/.github#943)"
        type: string
        default: ''
  push:
    branches: [main]   # the merged bump PR releases; any other push is a no-op
permissions:
  contents: read
# One run per commit at a time, never cancelled (a later run must not replace
# a merged bump's pending release).
concurrency:
  group: release-${{ github.sha }}
  cancel-in-progress: false
jobs:
  release:
    # Saves a runner on ordinary pushes; the workflow itself checks the PR. Any
    # commit of the push, not only its head: a merge queue batches (#943).
    if: "${{ github.event_name != 'push' || contains(toJSON(github.event.commits.*.message), 'chore(release): bump version ') }}"
    permissions: { contents: write, pull-requests: write, id-token: write, attestations: write }
    uses: swarm-routing/.github/.github/workflows/reusable-release.yml@e660ccde85c1a0be00f9ca3ab8b5f19042b04519 # main@2026-11-26
    with:
      mode: ${{ inputs.mode }}   # empty on push: release
      increment: ${{ inputs.increment != 'auto' && inputs.increment || '' }}   # '' for auto and on push
      tag: ${{ inputs.tag }}   # release-notes only; '' on push (swarm-routing/.github#524)
      sha: ${{ inputs.sha }}   # publish only; '' on push (swarm-routing/.github#943)
      # a dry run builds AntHocNet against this commit, report-only
      # (.github/downstream.txt, swarm-routing/.github#482)
      downstream-consumers: .github/downstream.txt
      # the vcpkg port of this repository's ns-3 modules (ns3/: routing-bench),
      # one port per simulator folder, on the ns3 port: each release opens its
      # bump PR in swarm-routing/vcpkg-registry (swarm-routing/.github#881)
      vcpkg-ports: sim-tools-ns3
    secrets:
      BOT_APP_ID: ${{ secrets.BOT_APP_ID }}
      BOT_APP_PRIVATE_KEY: ${{ secrets.BOT_APP_PRIVATE_KEY }}
      ORG_BOT_TOKEN: ${{ secrets.ORG_BOT_TOKEN }}

  image:
    needs: release
    if: ${{ needs.release.outputs.mode == 'release' }}
    permissions: { contents: read, packages: write, id-token: write, attestations: write }
    uses: swarm-routing/.github/.github/workflows/reusable-ns3-image.yml@e660ccde85c1a0be00f9ca3ab8b5f19042b04519 # main@2026-11-26
    with:
      modules: routing-bench=ns3/routing-bench
      image: ns3-tools
      tag: ${{ needs.release.outputs.tag }}

  # The Python distribution `swarm-sim-tools` (the wheel and sdist `make dist`
  # builds and checks) on PyPI by trusted publishing (OIDC, no token; #196):
  # a release to PyPI, a dry-run to TestPyPI (skip-existing, so a repeated
  # dry run of one version passes). The trusted publishers name this workflow
  # and an environment per index: `release` on PyPI, `dry-run` on TestPyPI
  # (swarm-routing/.github#441), so a dry run cannot publish to PyPI.
  pypi:
    needs: release
    if: ${{ needs.release.outputs.mode == 'release' || needs.release.outputs.mode == 'dry-run' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment: ${{ needs.release.outputs.mode == 'release' && 'release' || 'dry-run' }}
    permissions:
      id-token: write   # the trusted-publishing token exchange, nothing else
    env:
      MODE: ${{ needs.release.outputs.mode }}
      VER: ${{ needs.release.outputs.version }}
    steps:
      - name: Harden the runner (audit egress)
        uses: step-security/harden-runner@aebdcf6156ab6691adf63218240e476564a1ed4c # v2.23.0
        timeout-minutes: 2
        with:
          egress-policy: audit
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ${{ needs.release.outputs.artifact }}
          path: ${{ runner.temp }}/rel
      - name: The wheel and the sdist only
        run: |
          mkdir -p "$RUNNER_TEMP/pypi"
          for f in "swarm_sim_tools-${VER}-py3-none-any.whl" "swarm_sim_tools-${VER}.tar.gz"; do
            test -f "$RUNNER_TEMP/rel/release/$f" || { echo "::error::$f is not in the release assets"; exit 1; }
            cp "$RUNNER_TEMP/rel/release/$f" "$RUNNER_TEMP/pypi/"
          done
          ls -l "$RUNNER_TEMP/pypi"
      - name: Publish (${{ needs.release.outputs.mode == 'release' && 'PyPI' || 'TestPyPI' }})
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
        timeout-minutes: 5
        with:
          packages-dir: ${{ runner.temp }}/pypi
          repository-url: ${{ needs.release.outputs.mode == 'release' && 'https://upload.pypi.org/legacy/' || 'https://test.pypi.org/legacy/' }}
          # a re-run of a partly uploaded release skips what is already there and
          # uploads the rest ("Re-run all jobs" recovers it)
          skip-existing: true
