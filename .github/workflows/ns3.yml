name: ns-3

# The routing-bench harness (ns3/routing-bench, moved from AntHocNet, #2) in
# ghcr.io/swarm-routing/ns3-dev: build + test.py on the release ns-3 supports
# (`latest`, debug and sanitized), then the stock arms must each deliver.
#
# The aodv arm runs on `latest` with the rest: on ns-3.49 stock AODV livelocks
# (docs/ns3-bugs.md NS3-001, #238), so the arm installs it behind the ICMP
# no-route guard (nsnam/ns-3-dev!3101's rules; maintainer decision 2026-11-23:
# fix it in the harness, the images stay stock). It replaced the 3.48-only
# leg of option A. The suite's NS3-001 tests prove the guard on each image.
#
# The Python quality job (ruff + coverage.py over python/tests) runs here too,
# not in python.yml: SonarQube Cloud keeps one analysis per branch, so the one
# scan (in the module job) imports both gcovr's C++ report and coverage.py's
# Python report, and an artifact reaches only jobs of its own run (#67).
on:
  push:
    branches: [main]
  pull_request:
  merge_group:  # the merge queue runs the required checks on each group (swarm-routing/.github#130)
  workflow_dispatch:
    inputs:
      ns3-versions:
        description: 'On demand: JSON list of older ns-3 releases for the module build, e.g. ["3.42"]'
        default: ''

permissions:
  contents: read
  packages: read

# A newer push to the same pull request cancels this run (swarm-routing/.github#505):
# runners are shared by the whole org. Pushes, merge groups and dispatches run to the end.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  dev-images:
    # The campaign images' 2-day retention (swarm-routing/.github#370, #169):
    # ns3-tools-dev versions older than 2 days that no committed file and no
    # open swarm-routing/benchmarks pull request pins are deleted, on main only.
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    permissions:
      contents: read
      packages: write
    uses: swarm-routing/.github/.github/workflows/reusable-dev-image-cleanup.yml@e4ba96af97d87fdde768f9ef46d9dc4585c6c196 # main@2026-11-25
    with:
      packages: ns3-tools-dev

  python-quality:
    # ruff (org ruff.toml) + the self-tests under coverage, report-only
    # (swarm-routing/.github#35, phase 1); keeps the `python-coverage` artifact.
    # tools/checks/*.py is measured too (its tests in tools/checks/tests/), so
    # SonarQube Cloud sees the coverage of the CI scripts it analyses (#249).
    uses: swarm-routing/.github/.github/workflows/reusable-python-ci.yml@e4ba96af97d87fdde768f9ef46d9dc4585c6c196 # main@2026-11-25
    with:
      paths: python tools
      tests: python/tests/test_*.py tools/checks/tests/test_*.py
      # One comma-separated value: the reusable workflow passes one `--source`
      # per space-separated item, and coverage.py keeps only the last one, so
      # `python/ns3_tool tools/checks` measured tools/checks alone.
      source: python/ns3_tool,tools/checks

  module:
    # After the Python job, whose coverage the scan imports; but a ruff finding
    # there must not stop the ns-3 build (the scan then warns: C++ coverage only).
    needs: python-quality
    if: ${{ !cancelled() }}
    uses: swarm-routing/.github/.github/workflows/reusable-ns3-ci.yml@e4ba96af97d87fdde768f9ef46d9dc4585c6c196 # main@2026-11-25
    with:
      modules: routing-bench=ns3/routing-bench
      ns3-versions: ${{ inputs.ns3-versions || '["latest"]' }}
      # The harness keeps AntHocNet's formatting while it moves (a restyle would
      # hide the move in the diff); adopting the org .clang-format is its own PR.
      format: false
      # Org invariant 5: seed 1 twice byte-identical, seed 2 different
      # (swarm-routing/.github#26). OLSR: the stock arm that delivers on `latest`.
      # --perf=0: ##PERF## is CPU and wall time, which differ run to run by
      # nature (#91); the gate compares results. check-perf-markers.sh (the
      # stock-arms job) proves ##PERF## is the only line --perf adds.
      determinism: routing-compare --scenario=paper --nNodes=20 --time=30 --runs=1 --protocols=olsr --perf=0 --firstRun={seed}
      # routing-compare prints the seed (`firstRun=` in ##CONFIG##, the run index
      # after each marker tag); strip both before the cross-seed comparison, so
      # "seed 2 differs" has to come from the results (swarm-routing/.github#40).
      determinism-normalize: 's/firstRun=[0-9]+//; s/^(##[A-Z]+##) [0-9]+ /\1 /'
      # Strict warnings as errors on the harness's own code (ns-3's headers
      # exempt; #31). Automatic runs (`latest`, debug and sanitized) only: an
      # on-demand older image may predate --strict-warnings.
      strict-warnings: ${{ inputs.ns3-versions == '' }}
      # SonarQube Cloud CI analysis with gcovr coverage of the harness on the
      # automatic `latest` debug leg (swarm-routing/.github CONTRIBUTING
      # § Quality gates; report-only). Skipped on fork PRs (no token) and while
      # the project is on Automatic Analysis.
      coverage: ${{ inputs.ns3-versions == '' }}
      sonar: ${{ inputs.ns3-versions == '' }}
      # Leave gcov's exception-edge branches and those gcovr judges unreachable
      # out of the C++ report (swarm-routing/.github#446, opt-in; #204): every
      # call that may throw otherwise adds a branch no test can take
      # (arm-isolation.cc counted 842 branches for 168 lines).
      coverage-branch-filter: true
      # coverage.py's report of python/ns3_tool into the same analysis (#67).
      sonar-python-coverage: python-coverage
      dual-roots: 'python/ tools/'
      core-roots: ''
    secrets:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

  # The module's coverage report to Codecov (report-only; GitHub OIDC,
  # no Codecov token).
  codecov:
    needs: module
    if: inputs.ns3-versions == ''
    permissions:
      contents: read
      id-token: write
    uses: swarm-routing/.github/.github/workflows/reusable-codecov.yml@e4ba96af97d87fdde768f9ef46d9dc4585c6c196 # main@2026-11-25
    with:
      flags: ns3

  # The Python job's coverage.py report to Codecov, flag `python` (#67).
  codecov-python:
    needs: python-quality
    permissions:
      contents: read
      id-token: write
    uses: swarm-routing/.github/.github/workflows/reusable-codecov.yml@e4ba96af97d87fdde768f9ef46d9dc4585c6c196 # main@2026-11-25
    with:
      artifact: python-coverage
      files: coverage.xml
      flags: python

  # A docs-only pull request or merge group (swarm-routing/.github#581): the
  # stock-arms and scaffold jobs skip their steps, with no image pulled, and
  # still report.
  changes:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      docs-only: ${{ steps.changes.outputs.docs-only }}
    steps:
      - name: Harden the runner (audit egress)
        uses: step-security/harden-runner@aebdcf6156ab6691adf63218240e476564a1ed4c # v2.23.0
        timeout-minutes: 2  # its download and start take seconds (swarm-routing/.github#164)
        with:
          egress-policy: audit
      - uses: swarm-routing/.github/.github/actions/changes@e4ba96af97d87fdde768f9ef46d9dc4585c6c196 # main@2026-11-25
        id: changes
        timeout-minutes: 2

  stock-arms:
    name: stock arms deliver (${{ matrix.arms }} on ns-${{ matrix.version }})
    needs: changes
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    # no image on a docs-only change: the steps skip on the bare runner
    container:
      image: ${{ needs.changes.outputs.docs-only != 'true' && format('ghcr.io/swarm-routing/ns3-dev:{0}', matrix.version) || '' }}
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - version: latest
            arms: aodv olsr dsdv hwmp
    # No Harden-Runner here (swarm-routing/.github#164): a job that runs entirely
    # in a container cannot take it on a GitHub-hosted runner (it needs sudo on the VM).
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: needs.changes.outputs.docs-only != 'true'
        with:
          persist-credentials: false
      - name: Build routing-bench alone (stock ns-3 only) and run its suite
        if: needs.changes.outputs.docs-only != 'true'
        run: ns3-build-contrib --test "routing-bench=$GITHUB_WORKSPACE/ns3/routing-bench"
      - name: routing-bench's suite through the bare test runner, routing-bench alone (#211)
        if: needs.changes.outputs.docs-only != 'true'
        timeout-minutes: 10
        working-directory: /opt/ns-3
        # As a consumer runs it: test.py passes the runner extra arguments, so
        # the bare runner starts from another process state, and v1.1.0's
        # isolation test failed there 3 of 3 with routing-bench alone (#211).
        # The scaffold job runs the same with a second arm module installed.
        run: |
          runner=$(find build/utils -name 'ns3.*-test-runner-*' -type f | head -1)
          [ -n "$runner" ] || { echo "::error::no ns-3 test runner under build/utils"; exit 1; }
          for _ in 1 2 3; do "$runner" --suite=routing-bench; done
      - name: Every listed arm delivers; an unknown arm aborts
        if: needs.changes.outputs.docs-only != 'true'
        run: bash tools/checks/check-stock-arms.sh /opt/ns-3 "${{ matrix.arms }}"
      - name: "One ##PERF## line per arm and seed, and no other byte moves (#91)"
        if: needs.changes.outputs.docs-only != 'true' && (matrix.version == 'latest')
        timeout-minutes: 15
        run: bash tools/checks/check-perf-markers.sh /opt/ns-3 "olsr dsdv"
      - name: "The family catalogue's presets are what routing-compare prints in ##CONFIG## (#55)"
        if: needs.changes.outputs.docs-only != 'true' && (matrix.version == 'latest')
        timeout-minutes: 10
        run: bash tools/checks/check-scenario-configs.sh /opt/ns-3

  scaffold:
    needs: changes
    if: ${{ !cancelled() }}
    # ns3-tool scaffold (#39): the skeleton it writes builds as a contrib module
    # beside routing-bench with strict warnings, routing-compare offers its arm,
    # and the arm (stock OLSR until replaced) delivers.
    name: ns3-tool scaffold builds and registers an arm
    runs-on: ubuntu-latest
    timeout-minutes: 60
    # no image on a docs-only change: the steps skip on the bare runner
    container:
      image: ${{ needs.changes.outputs.docs-only != 'true' && 'ghcr.io/swarm-routing/ns3-dev:latest-debug' || '' }}
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    # No Harden-Runner here (swarm-routing/.github#164): a job that runs entirely
    # in a container cannot take it on a GitHub-hosted runner.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: needs.changes.outputs.docs-only != 'true'
        with:
          persist-credentials: false
      - name: Scaffold an arm module
        if: needs.changes.outputs.docs-only != 'true'
        run: python3 python/ns3_tool/cli.py scaffold scaffold-demo --out /tmp/scaffold --holder "ns3-tools CI"
      - name: Build it beside routing-bench (strict warnings)
        if: needs.changes.outputs.docs-only != 'true'
        run: ns3-build-contrib --strict-warnings "routing-bench=$GITHUB_WORKSPACE/ns3/routing-bench" scaffold-demo=/tmp/scaffold/scaffold-demo
      - name: routing-compare offers the arm, and it delivers
        if: needs.changes.outputs.docs-only != 'true'
        timeout-minutes: 15
        run: bash tools/checks/check-scaffold-arm.sh /opt/ns-3 scaffold-demo
      - name: routing-bench's suite through the bare test runner, another arm module installed (#211)
        if: needs.changes.outputs.docs-only != 'true'
        timeout-minutes: 10
        working-directory: /opt/ns-3
        # test.py passes extra arguments to the runner, so the runner alone is
        # another process state: the isolation test must pass there as well.
        run: |
          runner=$(find build/utils -name 'ns3.*-test-runner-*' -type f | head -1)
          for _ in 1 2 3; do "$runner" --suite=routing-bench; done

  failures-patched:
    needs: changes
    if: ${{ !cancelled() }}
    # routing-bench's suite on ns-3.49 sanitized with NS3-005's patch
    # (ns3/patches/NS3-005/, #374), built by swarm-routing/sim-containers at
    # sim-tools 1b36c739 and pinned by digest. On the stock images (the module
    # job) the suite leaves aodv out of --failures' node restart cases, which
    # overflow stock AODV's route lifetime (NS3-005); here it runs every case
    # for all three arms. Retire it with the NS3-005 patch, once a stock image
    # carries the fix (then the module job runs them).
    name: routing-bench suite on ns-3 patched for NS3-005 (sanitized)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    # no image on a docs-only change: the steps skip on the bare runner
    container:
      image: ${{ needs.changes.outputs.docs-only != 'true' && 'ghcr.io/swarm-routing/ns3-dev:3.49-sanitized-patched-5c58dfa@sha256:06b122a9405978d03276fbe9f210edda403374c02b879cdbebdd831ecb6672af' || '' }}
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    env:
      # as the module job's sanitized leg (reusable-ns3-ci.yml)
      ASAN_OPTIONS: detect_leaks=1:abort_on_error=1:strict_string_checks=1
      UBSAN_OPTIONS: print_stacktrace=1:halt_on_error=1
    # No Harden-Runner here (swarm-routing/.github#164): a job that runs entirely
    # in a container cannot take it on a GitHub-hosted runner.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: needs.changes.outputs.docs-only != 'true'
        with:
          persist-credentials: false
      - name: "The image's ns-3 has NS3-005's patch"
        if: needs.changes.outputs.docs-only != 'true'
        timeout-minutes: 2
        shell: bash
        run: |
          out=$(bash ns3/patches/NS3-005/apply.sh --dry-run /opt/ns-3)
          echo "$out"
          grep -q '^NS3-005: already-fixed: ' <<<"$out"
      - name: Build routing-bench (strict warnings) and run its suite, aodv restarts included
        if: needs.changes.outputs.docs-only != 'true'
        timeout-minutes: 45
        run: ns3-build-contrib --strict-warnings --test "routing-bench=$GITHUB_WORKSPACE/ns3/routing-bench"

  ns3-patches:
    needs: changes
    if: ${{ !cancelled() }}
    # ns3/patches/ (ns3/patches/README.md, #378): each patch to upstream ns-3
    # applies only where the bug is, with the outcome its README states for
    # latest; its reproducer fails on the stock tree and passes patched
    # (docs/ns3-bugs.md). Sanitized: NS3-005 is an overflow only UBSan shows.
    name: ns-3 patches apply only where the bug is
    runs-on: ubuntu-latest
    timeout-minutes: 60
    # no image on a docs-only change: the steps skip on the bare runner
    container:
      image: ${{ needs.changes.outputs.docs-only != 'true' && 'ghcr.io/swarm-routing/ns3-dev:latest-sanitized' || '' }}
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    # No Harden-Runner here (swarm-routing/.github#164): a job that runs entirely
    # in a container cannot take it on a GitHub-hosted runner.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: needs.changes.outputs.docs-only != 'true'
        with:
          persist-credentials: false
      - name: "Every patch's outcome on the stock tree is its README's (a refused patch fails)"
        if: needs.changes.outputs.docs-only != 'true'
        timeout-minutes: 2
        run: bash ns3/patches/apply.sh --dry-run --expect /opt/ns-3
      - name: "NS3-001: the ICMP no-route fix, nsnam/ns-3-dev!3101 (swarm-routing/ns3-tools#238)"
        if: needs.changes.outputs.docs-only != 'true'
        timeout-minutes: 25
        run: bash ns3/patches/NS3-001/test.sh /opt/ns-3
      - name: "NS3-005: AODV route lifetime saturation (swarm-routing/sim-tools#374)"
        if: needs.changes.outputs.docs-only != 'true'
        timeout-minutes: 20
        run: bash ns3/patches/NS3-005/test.sh /opt/ns-3
      - name: "The patched tree: every patch already-fixed"
        if: needs.changes.outputs.docs-only != 'true'
        timeout-minutes: 2
        shell: bash
        run: |
          out=$(bash ns3/patches/apply.sh /opt/ns-3)
          echo "$out"
          if grep -v ': already-fixed: ' <<<"$out"; then exit 1; fi
