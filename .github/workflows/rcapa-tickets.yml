name: RCAPA tickets

# swarm-routing/.github#952: an RCAPA document, register row or ns3/patches/NS3-NNN/
# change needs its [rcapa] ticket first, labelled, with the timeline linking its comments.
# No paths filter (org rule "Settings are code"): the job skips its work inside when no
# RCAPA path changed. Not a required check yet: that is a ruleset change in swarm-routing/.github.
on:
  pull_request:
  merge_group:

permissions:
  contents: read
  issues: read  # the ticket search and its comments, read-only

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  rcapa-tickets:
    name: RCAPA tickets come first
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Harden the runner (audit egress)
        uses: step-security/harden-runner@aebdcf6156ab6691adf63218240e476564a1ed4c # v2.23.0
        timeout-minutes: 2  # its download and start take seconds (swarm-routing/.github#164)
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0  # the merge base and the PR's first commit
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.13'
      - name: Does the change touch an RCAPA path?
        id: paths
        env:
          BASE_REF: ${{ github.event.pull_request.base.ref || github.event.merge_group.base_ref || 'main' }}
        run: |
          base="origin/${BASE_REF#refs/heads/}"
          git fetch --quiet origin "${base#origin/}"
          if git diff --name-only "$(git merge-base "$base" HEAD)" HEAD -- docs/ns3-rcapa docs/ns3-bugs.md ns3/patches | grep -q .; then
            echo "touched=true" >> "$GITHUB_OUTPUT"
          else
            echo "touched=false" >> "$GITHUB_OUTPUT"
            echo "No RCAPA path changed: nothing to check."
          fi
      - name: The self-test (a fake GitHub API)
        if: steps.paths.outputs.touched == 'true'
        run: python3 -I tools/checks/tests/test_check_rcapa_tickets.py
      - name: Tickets exist, are labelled, came first and are linked from the timeline
        if: steps.paths.outputs.touched == 'true'
        env:
          GITHUB_TOKEN: ${{ github.token }}
          BASE_REF: ${{ github.event.pull_request.base.ref || github.event.merge_group.base_ref || 'main' }}
        run: |
          base="${BASE_REF#refs/heads/}"
          python3 -I tools/checks/check-rcapa-tickets.py --base "origin/$base"
