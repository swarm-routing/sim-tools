name: Python

on:
  pull_request:
  merge_group:  # the merge queue runs the required checks on each group (swarm-routing/.github#130)
  push:
    branches: [main]

permissions:
  contents: read

# A newer push to the same pull request cancels this run (swarm-routing/.github#505):
# runners are shared by the whole org. Pushes, merge groups and dispatches run to the end.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  tests:
    name: ns3-tool tests (Python ${{ matrix.python }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python: ['3.11', '3.13']  # 3.11: tomllib
    steps:
      - name: Harden the runner (audit egress)
        uses: step-security/harden-runner@aebdcf6156ab6691adf63218240e476564a1ed4c # v2.23.0
        timeout-minutes: 2  # its download and start take seconds (swarm-routing/.github#164)
        with:
          egress-policy: audit
      # a docs-only change skips the steps below; the check still reports (swarm-routing/.github#581)
      - uses: swarm-routing/.github/.github/actions/changes@4ca39e56878af1b23a028c602d554a6f696b2ac2 # main@2026-11-27
        id: changes
        timeout-minutes: 2
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0  # check-published-paths.py diffs against origin/main from the merge base
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python }}
      # sim-tools#376, ADR-0002: a published path is never moved or deleted
      # without a new ADR. No docs-only skip: the table and the paths are docs.
      - name: Published paths are not moved or deleted
        run: |
          python3 -I tools/checks/tests/test_check_published_paths.py
          python3 -I tools/checks/check-published-paths.py --base origin/main
      - name: Self-tests (fixtures)
        if: steps.changes.outputs.docs-only != 'true'
        run: for t in python/tests/test_*.py; do echo "== $t"; python3 "$t"; done
      # ns3-tools#247: every reference in the ns-3 bug register and its RCAPAs
      # is fully qualified (swarm-routing/<repo>#N, nsnam/ns-3-dev#N|!N links).
      - name: References in the bug register are fully qualified
        # reads docs/: runs on a docs-only change too
        run: |
          python3 -I tools/checks/check-refs.py --self-test
          python3 -I tools/checks/check-refs.py docs/ns3-bugs.md docs/ns3-rcapa/
      # ns3-tools#55: the network-family catalogue is complete, sourced and
      # agrees with scenario_check and its pages.
      - name: The family catalogue (scenarios/)
        # reads docs/families/: runs on a docs-only change too
        run: python3 -I tools/checks/check-scenarios.py
      # #377: the agnostic modules of python/ns3_tool import no ns-3-bound one
      # and name no ns-3 path or program (docs/layout.md "Python modules").
      - name: The simulator-agnostic / ns-3 boundary (python/ns3_tool)
        # reads docs/layout.md: runs on a docs-only change too
        run: python3 -I tools/checks/check-python-boundary.py
      - name: Install the package; console scripts run
        if: steps.changes.outputs.docs-only != 'true'
        timeout-minutes: 5  # an install, as the PyYAML step (seconds in a green run)
        run: |
          # the build backend from its hash-pinned lock, then the package with no
          # index fetch: no dependencies, no isolated build (swarm-routing/.github#716)
          python3 -m pip install --quiet --only-binary :all: --require-hashes -r tools/requirements/build.txt
          python3 -m pip install --no-deps --no-build-isolation ./python
          cd "$RUNNER_TEMP"
          ns3-bench-parse "$GITHUB_WORKSPACE"/python/tests/fixtures/cells/fanet-main-6arm.txt | grep -q '95% CI'
          ns3-scenario-check results "$GITHUB_WORKSPACE"/python/tests/fixtures/cells/sat-base-app517.txt \
            --anchors "$GITHUB_WORKSPACE"/python/tests/fixtures/anchors.yml | grep -q '^verdict: '
          ns3-scenario-check preflight --family fanet --catalogue "$GITHUB_WORKSPACE"/scenarios \
            | grep -qx 'verdict: WARN (0 fail, 2 warn)'
          ns3-campaign validate "$GITHUB_WORKSPACE"/campaigns/anthocnet-aodv-smoke.toml
          ns3-tool --help | grep -q '  scaffold '
          ns3-tool compare "$GITHUB_WORKSPACE"/python/tests/fixtures/cells/fanet-main-6arm.txt | grep -q '95% CI'

  corpus:
    name: query equivalence on AntHocNet's committed cells
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Harden the runner (audit egress)
        uses: step-security/harden-runner@aebdcf6156ab6691adf63218240e476564a1ed4c # v2.23.0
        timeout-minutes: 2  # its download and start take seconds (swarm-routing/.github#164)
        with:
          egress-policy: audit
      # a docs-only change skips the steps below; the check still reports (swarm-routing/.github#581)
      - uses: swarm-routing/.github/.github/actions/changes@4ca39e56878af1b23a028c602d554a6f696b2ac2 # main@2026-11-27
        id: changes
        timeout-minutes: 2
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: steps.changes.outputs.docs-only != 'true'
        with:
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: steps.changes.outputs.docs-only != 'true'
        with:
          repository: swarm-routing/AntHocNet
          path: anthocnet
          sparse-checkout: |
            results/cells
            tools/bench/scenario_check.py
            tools/bench/campaign.py
            tools/bench/bench_parse.py
            tools/bench/stats_util.py
            tools/bench/campaigns
          persist-credentials: false
      - run: NS3_TOOL_CELLS="$PWD/anthocnet/results/cells" python3 python/tests/test_bench_parse_query.py
        if: steps.changes.outputs.docs-only != 'true'
      # ns3-tools#3: the same corpus through the built wheel, installed into a
      # fresh venv; the test fails if ns3_tool resolves to the source tree.
      - name: The installed wheel parses every cell
        if: steps.changes.outputs.docs-only != 'true'
        timeout-minutes: 5  # two venvs and a hash-pinned install (seconds in a green run)
        run: |
          python3 -m venv "$RUNNER_TEMP/build-venv"
          "$RUNNER_TEMP/build-venv/bin/python" -m pip install --quiet --only-binary :all: --require-hashes -r tools/requirements/build.txt
          # a copy, so no build/ or egg-info lands in the checkout; -L resolves the licence symlinks (#14)
          cp -rL python "$RUNNER_TEMP/src"
          "$RUNNER_TEMP/build-venv/bin/python" -m pip wheel --quiet --no-deps --no-build-isolation \
            -w "$RUNNER_TEMP/dist" "$RUNNER_TEMP/src"
          python3 -m venv "$RUNNER_TEMP/wheel-venv"
          "$RUNNER_TEMP/wheel-venv/bin/python" -m pip install --quiet --no-index --no-deps "$RUNNER_TEMP"/dist/swarm_sim_tools-*.whl
          NS3_TOOL_INSTALLED=1 NS3_TOOL_CELLS="$PWD/anthocnet/results/cells" \
            "$RUNNER_TEMP/wheel-venv/bin/python" -I python/tests/test_bench_parse_query.py
      # ns3-tools#28: the port's verdicts equal AntHocNet's script on every cell.
      - if: steps.changes.outputs.docs-only != 'true'
        run: |
          NS3_TOOL_CELLS="$PWD/anthocnet/results/cells" \
          NS3_TOOL_SCENARIO_CHECK="$PWD/anthocnet/tools/bench/scenario_check.py" \
            python3 python/tests/test_scenario_check_corpus.py
      # ns3-tools#81: change-plan verdicts equal AntHocNet's campaign.py on
      # every committed plan (the plans are YAML: PyYAML, for both scripts).
      - name: PyYAML
        if: steps.changes.outputs.docs-only != 'true'
        timeout-minutes: 5
        run: |
          python3 -m pip install --quiet --only-binary :all: --require-hashes -r tools/requirements/pyyaml.txt
      - run: NS3_TOOL_ANTHOCNET="$PWD/anthocnet" python3 python/tests/test_change_plan.py
        if: steps.changes.outputs.docs-only != 'true'

# ruff and the self-tests under coverage (reusable-python-ci.yml) run in
# ns3.yml, job `python-quality`: the SonarQube Cloud scan there imports their
# coverage, and an artifact reaches only jobs of its own run (#67).
